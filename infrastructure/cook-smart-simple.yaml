AWSTemplateFormatVersion: "2010-09-09"
Description: "Cook Smart - Simple Production Infrastructure"

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of existing EC2 KeyPair for SSH access
    
  YourPublicIP:
    Type: String
    Description: "Your public IP address for SSH access (format: x.x.x.x/32)"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/32$"
    ConstraintDescription: "Must be a valid IP address in CIDR format (x.x.x.x/32)"

Resources:
  # Security Group for Cook Smart Application
  CookSmartSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Cook Smart application
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref YourPublicIP
          Description: SSH access from your IP
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: HTTP access
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
          Description: HTTPS access
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: "0.0.0.0/0"
          Description: Node.js application port
      Tags:
        - Key: Name
          Value: cook-smart-sg
        - Key: Application
          Value: cook-smart

  # EC2 Instance
  CookSmartInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c02fb55956c7d316
      InstanceType: t3.small
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref CookSmartSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 30
            DeleteOnTermination: true
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          apt-get update -y
          apt-get upgrade -y
          
          # Install basic tools
          apt-get install -y curl wget git htop
          
          # Create deployment ready marker
          touch /home/ubuntu/cloudformation-complete
          chown ubuntu:ubuntu /home/ubuntu/cloudformation-complete
          
          # Signal completion
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource CookSmartInstance --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: cook-smart-backend
        - Key: Application
          Value: cook-smart
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT10M

  # Elastic IP
  CookSmartElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref CookSmartInstance
      Tags:
        - Key: Name
          Value: cook-smart-eip
        - Key: Application
          Value: cook-smart

Outputs:
  InstanceId:
    Description: "EC2 Instance ID"
    Value: !Ref CookSmartInstance
    Export:
      Name: !Sub "${AWS::StackName}-InstanceId"

  PublicIP:
    Description: "Public IP Address (Elastic IP)"
    Value: !Ref CookSmartElasticIP
    Export:
      Name: !Sub "${AWS::StackName}-PublicIP"

  SecurityGroupId:
    Description: "Security Group ID"
    Value: !Ref CookSmartSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-SecurityGroupId"

  SSHCommand:
    Description: "SSH command to connect to the instance"
    Value: !Sub "ssh -i ~/.ssh/${KeyPairName}.pem ubuntu@${CookSmartElasticIP}"

  NextSteps:
    Description: "Next steps for deployment"
    Value: !Sub |
      1. SSH to instance: ssh -i ~/.ssh/${KeyPairName}.pem ubuntu@${CookSmartElasticIP}
      2. Clone repository: git clone https://github.com/your-username/cook-smart.git
      3. Run deployment: cd cook-smart && ./scripts/deploy-cook-smart-fresh.sh
      4. Configure SSL: ./scripts/setup-ssl-and-dns.sh
      5. Verify deployment: ./scripts/verify-deployment.sh
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cook Smart Website - AWS Amplify Hosting Infrastructure'

Resources:
  # Amplify App for Website Hosting (without GitHub connection)
  CookSmartAmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: 'cook-smart-website'
      Description: 'Cook Smart Website - Static Next.js Site'
      Platform: WEB_COMPUTE
      
      # Build settings for Next.js
      BuildSpec: |
        version: 1
        applications:
          - appRoot: website
            frontend:
              phases:
                preBuild:
                  commands:
                    - npm ci
                build:
                  commands:
                    - npm run build
              artifacts:
                baseDirectory: out
                files:
                  - '**/*'
              cache:
                paths:
                  - node_modules/**/*
                  - .next/cache/**/*
      
      # Environment variables
      EnvironmentVariables:
        - Name: AMPLIFY_MONOREPO_APP_ROOT
          Value: website
        - Name: AMPLIFY_DIFF_DEPLOY
          Value: false
        - Name: _LIVE_UPDATES
          Value: '[{"name":"Next.js","pkg":"next","type":"framework","version":"14"}]'
      
      # Custom rules for SPA routing
      CustomRules:
        - Source: '/recipes'
          Target: '/recipes/'
          Status: '301'
        - Source: '/about'
          Target: '/about/'
          Status: '301'
        - Source: '/contact'
          Target: '/contact/'
          Status: '301'
        - Source: '/faq'
          Target: '/faq/'
          Status: '301'
        - Source: '/<*>'
          Target: '/index.html'
          Status: '404-200'

Outputs:
  AmplifyAppId:
    Description: 'Amplify App ID'
    Value: !GetAtt CookSmartAmplifyApp.AppId
    Export:
      Name: !Sub '${AWS::StackName}-AmplifyAppId'
  
  AmplifyConsoleUrl:
    Description: 'Amplify Console URL'
    Value: !Sub 'https://console.aws.amazon.com/amplify/home#/apps/${CookSmartAmplifyApp.AppId}'
    Export:
      Name: !Sub '${AWS::StackName}-AmplifyConsoleUrl'
  
  SetupInstructions:
    Description: 'Next Steps'
    Value: 'Go to AWS Amplify Console and connect your GitHub repository'

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd website
        - node --version
        - npm --version
        - npm ci --legacy-peer-deps --no-audit
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: website/.next
    files:
      - '**/*'
  cache:
    paths:
      - website/node_modules/**/*
      - website/.next/cache/**/*